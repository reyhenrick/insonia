name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, such as v1.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a version tag such as v1.2.0.' >&2; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - name: Match version to source
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          [ "$RELEASE_TAG" = "v$VERSION" ] || { echo 'Tag does not match Info.plist.' >&2; exit 1; }
      - name: Preserve an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/insonia-release-tags.txt"
          if grep -Fxq -- "$RELEASE_TAG" "$RUNNER_TEMP/insonia-release-tags.txt"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists. Its downloads and notes were preserved."
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        if: steps.existing.outputs.exists == 'false'
        run: ./test.sh
      - name: Build universal application
        if: steps.existing.outputs.exists == 'false'
        run: ./build.sh
      - name: Package and verify downloads
        if: steps.existing.outputs.exists == 'false'
        run: ./scripts/package-release.sh
      - name: Prepare release notes
        if: steps.existing.outputs.exists == 'false'
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads(Path('dist/release-metadata.json').read_text())
          app = metadata['application']
          notes = f"""Insonia {app['version']} keeps your Mac awake from the menu bar, with automatic language selection and independent recovery.

          **Download:** choose `Insonia-macOS.dmg`, open it, and drag Insonia to Applications. A ZIP is also available. Both include an installation guide.

          **Requires:** macOS {app['minimumMacOS']} or later. Universal application for Apple silicon and Intel.

          **Signing:** {app['signing']['mode']}. **Apple notarization:** {metadata['notarization']['status']}. This workflow does not submit software for notarization. macOS may require approval in Privacy & Security on first launch.

          `SHA256SUMS.txt` verifies the downloads. `release-metadata.json` records their signing status, architecture, version, and hashes.

          Read the [installation and usage guide](https://github.com/{os.environ['GITHUB_REPOSITORY']}#install-and-start) before enabling lid-closed operation.
          """
          Path(os.environ['RUNNER_TEMP'], 'insonia-release-notes.md').write_text(notes)
          PY
      - name: Publish new release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Insonia ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/insonia-release-notes.md" \
            dist/Insonia-macOS.dmg dist/Insonia-macOS.zip dist/SHA256SUMS.txt dist/release-metadata.json
