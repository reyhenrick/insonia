name: Verify release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify, such as v1.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a version tag such as v1.3.0.' >&2; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - name: Match version to source
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          [ "$RELEASE_TAG" = "v$VERSION" ] || { echo 'Tag does not match Info.plist.' >&2; exit 1; }
      - name: Test
        run: ./test.sh
      - name: Build universal application
        run: ./build.sh
      - name: Package and verify downloads
        run: ./scripts/package-release.sh
      - name: Save unsigned update packages for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Insonia-macOS-${{ env.RELEASE_TAG }}-${{ github.sha }}
          path: |
            dist/Insonia-macOS.dmg
            dist/Insonia-macOS.zip
            dist/SHA256SUMS.txt
            dist/release-metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Explain the local publication step
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          These packages passed the automated checks, but do not contain a signed update feed and are not published as a GitHub Release.

          The maintainer builds and signs the final release locally with `./scripts/sign-release.sh`, then verifies it with `./scripts/verify-release.sh --require-feed dist` before publishing all five artifacts. The private update key stays in the macOS Keychain and is never exported to CI.

          See [the release instructions](https://github.com/reyhenrick/insonia/blob/main/CONTRIBUTING.md) for the complete workflow.
          EOF
