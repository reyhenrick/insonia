name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test
        run: ./test.sh
      - name: Build universal application
        run: ./build.sh
      - name: Package and verify downloads
        run: ./scripts/package-release.sh
      - name: Save verified downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Insonia-macOS-${{ github.sha }}
          path: |
            dist/Insonia-macOS.dmg
            dist/Insonia-macOS.zip
            dist/SHA256SUMS.txt
            dist/release-metadata.json
          if-no-files-found: error
          retention-days: 14
